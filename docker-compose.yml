version: "3.9"

services:
  # ── PostgreSQL (production DB) ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: hwopt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospital_workforce
      POSTGRES_USER: hwopt_user
      POSTGRES_PASSWORD: hwopt_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hwopt_user -d hospital_workforce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hwopt_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hwopt_user:hwopt_pass@db:5432/hospital_workforce
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
      - ./optimization:/app/optimization
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hwopt_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
